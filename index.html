<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kindle Sokoban</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
body{padding:4px 6px 5px;text-align:center}
#app{width:100%;margin:0 auto;position:relative}
#top{width:100%;height:44px;line-height:44px;white-space:nowrap;text-align:left;position:relative;margin:0 0 4px 0}
#title{display:inline-block;font-size:27px;font-weight:900;letter-spacing:-1px;margin-right:9px;vertical-align:middle}
.topbtn{height:38px;margin:2px 1px;padding:0;border:2px solid #000;border-radius:0;background:#fff;color:#000;font-size:15px;font-weight:900;font-family:Arial,Helvetica,sans-serif;-webkit-appearance:none;vertical-align:middle}
#prevBtn,#nextBtn{width:42px;font-size:25px;line-height:32px}
#levelLabel{display:inline-block;width:34px;text-align:center;font-size:17px;font-weight:900;vertical-align:middle}
#movesLabel{display:inline-block;min-width:78px;text-align:center;font-size:15px;font-weight:900;vertical-align:middle}
#undoBtn{width:60px}
#resetBtn{width:64px}
#boardWrap{width:100%;text-align:center;overflow:hidden}
#board{border-collapse:collapse;border-spacing:0;margin:0 auto;table-layout:fixed}
#board td{padding:0;margin:0;border:0;position:relative;overflow:hidden}
.tile{position:relative;width:100%;height:100%;overflow:hidden}
.floor{background:#f8f8f8;border:1px solid #d3d3d3}
.wall{background:#6f6f6f;border:2px solid #222;box-shadow:inset 0 0 0 2px #999}
.wall:after{content:"";position:absolute;left:8%;right:8%;top:46%;height:2px;background:#333}
.target:after{content:"";position:absolute;width:26%;height:26%;left:37%;top:37%;border-radius:50%;background:#777}
.box{position:absolute;left:8%;top:8%;width:84%;height:84%;background:#bdbdbd;border:3px solid #222;z-index:4}
.box:before,.box:after{content:"";position:absolute;left:47%;top:4%;width:3px;height:92%;background:#555;transform-origin:center}
.box:before{transform:rotate(45deg)}
.box:after{transform:rotate(-45deg)}
.box.placed{background:#8b8b8b;box-shadow:inset 0 0 0 3px #e3e3e3}
.player{position:absolute;left:18%;top:12%;width:64%;height:76%;z-index:6}
.playerHead{position:absolute;width:64%;height:42%;left:18%;top:0;border:3px solid #111;border-radius:50%;background:#d9d9d9}
.playerCap{position:absolute;left:10%;top:1%;width:72%;height:17%;border:3px solid #111;border-bottom-width:2px;background:#8c8c8c}
.playerBody{position:absolute;width:56%;height:42%;left:22%;top:42%;border:3px solid #111;background:#777}
.playerLegL,.playerLegR{position:absolute;width:22%;height:16%;bottom:0;background:#111}
.playerLegL{left:22%}.playerLegR{right:22%}
.player.faceL{transform:scaleX(-1)}
.flashBad{background:#c9c9c9!important}
.flashTarget{background:#b7b7b7!important}
#modalBlocker{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:#fff;opacity:.01;z-index:900}
#resultOverlay{display:none;position:absolute;width:52%;padding:18px 12px 15px;border:3px solid #000;background:#fff;color:#000;text-align:center;z-index:999}
#resultTitle{font-size:24px;font-weight:900;margin-bottom:12px}
#resultText{font-size:17px;line-height:1.35;margin-bottom:14px}
.resultButton{display:block;width:84%;height:40px;margin:0 auto 12px;border:3px solid #000;border-radius:0;background:#fff;color:#000;font-size:16px;font-weight:900;-webkit-appearance:none}
#resultClose{display:inline-block;padding:6px 12px;font-size:15px;font-weight:bold}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <span id="title">SOKOBAN</span>
  <button id="prevBtn" class="topbtn" type="button">&#9664;</button>
  <span id="levelLabel">11</span>
  <button id="nextBtn" class="topbtn" type="button">&#9654;</button>
  <span id="movesLabel">Moves 0</span>
  <button id="undoBtn" class="topbtn" type="button">Undo</button>
  <button id="resetBtn" class="topbtn" type="button">Reset</button>
 </div>
 <div id="boardWrap"><table id="board"><tbody></tbody></table></div>
 <div id="modalBlocker"></div>
 <div id="resultOverlay">
   <div id="resultTitle">LEVEL COMPLETE</div>
   <div id="resultText">Moves: 0</div>
   <button id="resultAction" class="resultButton" type="button">NEXT LEVEL</button>
   <span id="resultClose">Close</span>
 </div>
</div>
<script>
(function(){
var SAVE_PREFIX="kindleSokoban_v1_";
var LEVELS=[
 {id:11,map:["#######","#  .  #","#  $  #","#  @  #","#     #","#######"]},
 {id:12,map:["########","#  .   #","#  $   #","#  ##  #","#   @  #","#      #","########"]},
 {id:13,map:["#########","# .   . #","# $ # $ #","#   #   #","#   @   #","#       #","#########"]},
 {id:14,map:["##########","#   .    #","#   $    #","#  ###   #","#        #","#   @    #","##########"]},
 {id:15,map:["##########","# .   .  #","# $$     #","#   ###  #","#        #","#   @    #","##########"]}
];
var levelIndex=0,terrain=[],boxes={},player={r:0,c:0,dir:"R"},moves=0,history=[],moving=false,autoTimer=null,finished=false;
var board=document.getElementById("board"),tbody=board.getElementsByTagName("tbody")[0];
var levelLabel=document.getElementById("levelLabel"),movesLabel=document.getElementById("movesLabel"),resetBtn=document.getElementById("resetBtn");

function key(r,c){return r+","+c}
function inBounds(r,c){return r>=0&&c>=0&&r<terrain.length&&c<terrain[r].length}
function isWall(r,c){return !inBounds(r,c)||terrain[r][c]==="#"}
function hasBox(r,c){return !!boxes[key(r,c)]}
function isFree(r,c){return inBounds(r,c)&&!isWall(r,c)&&!hasBox(r,c)}
function targetAt(r,c){return terrain[r][c]==="."}
function cloneBoxes(){var b={},k;for(k in boxes)if(boxes.hasOwnProperty(k))b[k]=1;return b}
function saveSnapshot(){history.push({r:player.r,c:player.c,dir:player.dir,boxes:cloneBoxes(),moves:moves});if(history.length>500)history.shift()}
function applySnapshot(s){player.r=s.r;player.c=s.c;player.dir=s.dir;boxes=s.boxes;moves=s.moves;finished=false;moving=false;updateTop();render();saveState()}
function parseLevel(lv){
 terrain=[];boxes={};history=[];moves=0;finished=false;moving=false;
 var r,c,row,ch;
 for(r=0;r<lv.map.length;r++){
  row=[];
  for(c=0;c<lv.map[r].length;c++){
   ch=lv.map[r].charAt(c);
   if(ch==="#")row.push("#");
   else if(ch===".")row.push(".");
   else if(ch==="$"){row.push(" ");boxes[key(r,c)]=1}
   else if(ch==="*"){row.push(".");boxes[key(r,c)]=1}
   else if(ch==="@"){row.push(" ");player.r=r;player.c=c}
   else if(ch==="+"){row.push(".");player.r=r;player.c=c}
   else row.push(" ");
  }
  terrain.push(row);
 }
 player.dir="R";
}
function updateTop(){levelLabel.innerHTML=LEVELS[levelIndex].id;movesLabel.innerHTML="Moves "+moves}
function calcCellSize(){
 var rows=terrain.length,cols=0,r,ww,wh,availW,availH,size;
 for(r=0;r<rows;r++)if(terrain[r].length>cols)cols=terrain[r].length;
 ww=window.innerWidth||document.documentElement.clientWidth||800;
 wh=window.innerHeight||document.documentElement.clientHeight||1000;
 availW=ww-14;availH=wh-56;
 size=Math.floor(Math.min(availW/cols,availH/rows));
 if(size<28)size=28;if(size>72)size=72;return size;
}
function render(){
 var size=calcCellSize(),r,c,tr,td,tile,b,pl,head,cap,body,ll,lr,maxCols=0;
 tbody.innerHTML="";
 for(r=0;r<terrain.length;r++)if(terrain[r].length>maxCols)maxCols=terrain[r].length;
 for(r=0;r<terrain.length;r++){
  tr=document.createElement("tr");
  for(c=0;c<maxCols;c++){
   td=document.createElement("td");td.style.width=size+"px";td.style.height=size+"px";
   tile=document.createElement("div");tile.className="tile "+(isWall(r,c)?"wall":"floor");
   if(!isWall(r,c)&&targetAt(r,c))tile.className+=" target";
   if(hasBox(r,c)){b=document.createElement("div");b.className="box"+(targetAt(r,c)?" placed":"");tile.appendChild(b)}
   if(player.r===r&&player.c===c){
    pl=document.createElement("div");pl.className="player"+(player.dir==="L"?" faceL":"");
    head=document.createElement("div");head.className="playerHead";
    cap=document.createElement("div");cap.className="playerCap";
    body=document.createElement("div");body.className="playerBody";
    ll=document.createElement("div");ll.className="playerLegL";
    lr=document.createElement("div");lr.className="playerLegR";
    pl.appendChild(head);pl.appendChild(cap);pl.appendChild(body);pl.appendChild(ll);pl.appendChild(lr);tile.appendChild(pl);
   }
   td.appendChild(tile);
   (function(rr,cc,cell){cell.onclick=function(){handleTap(rr,cc)}})(r,c,td);
   tr.appendChild(td);
  }
  tbody.appendChild(tr);
 }
}
function positionResult(){
 var o=document.getElementById("resultOverlay"),br=board.getBoundingClientRect(),or=o.getBoundingClientRect();
 var sx=window.pageXOffset||0,sy=window.pageYOffset||0;
 o.style.left=Math.round(br.left+sx+(br.width-or.width)/2)+"px";
 o.style.top=Math.round(br.top+sy+(br.height-or.height)/2+8)+"px";
}
function modalOpen(){return document.getElementById("resultOverlay").style.display==="block"}
function showResult(){document.getElementById("resultText").innerHTML="Moves: <b>"+moves+"</b>";document.getElementById("modalBlocker").style.display="block";document.getElementById("resultOverlay").style.display="block";positionResult()}
function closeResult(){document.getElementById("resultOverlay").style.display="none";document.getElementById("modalBlocker").style.display="none"}
function levelComplete(){var k,rc,r,c;for(k in boxes)if(boxes.hasOwnProperty(k)){rc=k.split(",");r=parseInt(rc[0],10);c=parseInt(rc[1],10);if(!targetAt(r,c))return false}return true}
function findCell(r,c){var rows=tbody.getElementsByTagName("tr");if(r<0||r>=rows.length)return null;var cells=rows[r].getElementsByTagName("td");if(c<0||c>=cells.length)return null;return cells[c]}
function flashPlaced(r,c){var td=findCell(r,c);if(!td)return;td.firstChild.className+=" flashTarget";setTimeout(function(){render()},450)}
function setDirection(dr,dc){if(dc<0)player.dir="L";else if(dc>0)player.dir="R";else if(dr<0)player.dir="U";else player.dir="D"}
function moveOne(dr,dc,allowPush){
 if(finished)return false;
 var nr=player.r+dr,nc=player.c+dc,br,bc;
 setDirection(dr,dc);
 if(isWall(nr,nc))return false;
 if(hasBox(nr,nc)){
  if(!allowPush)return false;br=nr+dr;bc=nc+dc;if(!isFree(br,bc))return false;
  saveSnapshot();delete boxes[key(nr,nc)];boxes[key(br,bc)]=1;player.r=nr;player.c=nc;moves++;
  updateTop();render();saveState();if(targetAt(br,bc))flashPlaced(br,bc);
  if(levelComplete()){finished=true;saveState();setTimeout(showResult,550)}return true;
 }
 saveSnapshot();player.r=nr;player.c=nc;moves++;updateTop();render();saveState();return true;
}
function bfs(sr,sc,tr,tc){
 var q=[[sr,sc]],head=0,seen={},prev={},cur,r,c,nr,nc,i,dirs=[[-1,0],[1,0],[0,-1],[0,1]];
 seen[key(sr,sc)]=1;
 while(head<q.length){
  cur=q[head++];r=cur[0];c=cur[1];if(r===tr&&c===tc)break;
  for(i=0;i<4;i++){nr=r+dirs[i][0];nc=c+dirs[i][1];if(!seen[key(nr,nc)]&&isFree(nr,nc)){seen[key(nr,nc)]=1;prev[key(nr,nc)]=[r,c];q.push([nr,nc])}}
 }
 if(!seen[key(tr,tc)])return null;
 var path=[],cr=tr,cc=tc,p;
 while(!(cr===sr&&cc===sc)){path.push([cr,cc]);p=prev[key(cr,cc)];if(!p)return null;cr=p[0];cc=p[1]}
 path.reverse();return path;
}
function autoWalk(path){
 if(!path||!path.length)return;moving=true;var i=0;
 function step(){if(i>=path.length){moving=false;return}var rr=path[i][0],cc=path[i][1],dr=rr-player.r,dc=cc-player.c;if(!moveOne(dr,dc,false)){moving=false;return}i++;autoTimer=setTimeout(step,95)}
 step();
}
function flashBad(r,c){var td=findCell(r,c);if(!td)return;td.firstChild.className+=" flashBad";setTimeout(function(){render()},350)}
function handleTap(r,c){
 if(modalOpen()||moving||finished)return;
 if(isWall(r,c)){flashBad(r,c);return}
 if(hasBox(r,c)){var dr=r-player.r,dc=c-player.c;if(Math.abs(dr)+Math.abs(dc)===1){if(!moveOne(dr,dc,true))flashBad(r,c)}else flashBad(r,c);return}
 if(r===player.r&&c===player.c)return;
 var path=bfs(player.r,player.c,r,c);if(!path){flashBad(r,c);return}autoWalk(path);
}
function undo(){if(modalOpen()||moving||finished||!history.length)return;applySnapshot(history.pop())}
function resetNow(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null}parseLevel(LEVELS[levelIndex]);try{localStorage.removeItem(SAVE_PREFIX+LEVELS[levelIndex].id)}catch(e){}updateTop();render();saveState();resetBtn.innerHTML="Reset"}
var resetArmed=false,resetTimer=null;
function resetAction(){if(modalOpen()||moving)return;if(!resetArmed){resetArmed=true;resetBtn.innerHTML="Sure?";if(resetTimer)clearTimeout(resetTimer);resetTimer=setTimeout(function(){resetArmed=false;resetBtn.innerHTML="Reset"},2500)}else{resetArmed=false;if(resetTimer){clearTimeout(resetTimer);resetTimer=null}resetNow()}}
function changeLevel(step){if(modalOpen()||moving)return;var ni=levelIndex+step;if(ni<0||ni>=LEVELS.length)return;levelIndex=ni;loadLevel()}
function saveState(){try{localStorage.setItem(SAVE_PREFIX+LEVELS[levelIndex].id,JSON.stringify({player:player,boxes:boxes,moves:moves,finished:finished,history:history}))}catch(e){}}
function loadState(){try{var raw=localStorage.getItem(SAVE_PREFIX+LEVELS[levelIndex].id),o;if(!raw)return false;o=JSON.parse(raw);if(!o||!o.player||!o.boxes)return false;player=o.player;boxes=o.boxes;moves=parseInt(o.moves||0,10);finished=!!o.finished;history=o.history||[];return true}catch(e){return false}}
function loadLevel(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null}closeResult();parseLevel(LEVELS[levelIndex]);loadState();updateTop();render()}
document.getElementById("prevBtn").onclick=function(){changeLevel(-1)};
document.getElementById("nextBtn").onclick=function(){changeLevel(1)};
document.getElementById("undoBtn").onclick=undo;
document.getElementById("resetBtn").onclick=resetAction;
document.getElementById("resultClose").onclick=closeResult;
document.getElementById("resultAction").onclick=function(){closeResult();if(levelIndex<LEVELS.length-1){levelIndex++;loadLevel()}};
document.getElementById("modalBlocker").onclick=function(){return false};
window.onresize=function(){render();if(modalOpen())positionResult()};
loadLevel();
})();
</script>
</body>
</html>
