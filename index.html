<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kindle Sokoban Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
body{padding:4px 5px}
#top{height:44px;white-space:nowrap;display:flex;align-items:center;gap:4px}
#title{font-size:25px;font-weight:900;letter-spacing:-1px;margin-right:3px}
button{height:36px;border:2px solid #111;background:#fff;color:#111;border-radius:0;font-weight:900;font-size:14px;padding:0 9px;-webkit-appearance:none}
#level{font-size:16px;font-weight:900;min-width:26px;text-align:center}
#moves{font-size:14px;font-weight:900;min-width:72px;text-align:center}
#boardWrap{width:100%;height:calc(100vh - 52px);display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#board{position:relative;background:#fff;touch-action:manipulation}
.cell{position:absolute;overflow:visible}
.cell img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.floor{z-index:1}.base{z-index:2}.actor{z-index:4}
#message{display:none;position:absolute;z-index:50;background:#fff;border:3px solid #111;padding:14px 18px;text-align:center;font-weight:900;font-size:18px;min-width:210px}
#message small{display:block;font-size:14px;margin-top:7px;font-weight:700}
</style>
</head>
<body>
<div id="top">
 <span id="title">SOKOBAN</span>
 <span id="level">11</span>
 <span id="moves">Moves 0</span>
 <button id="undo">Undo</button>
 <button id="reset">Reset</button>
</div>
<div id="boardWrap"><div id="board"></div></div>
<div id="message"></div>
<script>
(function(){
var A="assets/";
var rows=8, cols=9;
var map=[
"#######D#",
"#       #",
"# T T T #",
"#       #",
"# F C A #",
"#       #",
"#   @   #",
"#########"
];
// F fish box, C coffee, A fruit/apple box. Targets at row2 cols2,4,6 respectively.
var targetTypes={"2,2":"fish","2,4":"coffee","2,6":"fruit"};
var boxTypes={"4,2":"fish","4,4":"coffee","4,6":"fruit"};
var player={r:6,c:4,dir:"U"}, moves=0, history=[], walking=false, phase=0, door="closed", finished=false;
var obstacles={"1,1":"barrel","1,7":"rope","5,7":"cart"};
var floorVariant={};
for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)floorVariant[r+","+c]=((r*7+c*3)%3)+1;
var board=document.getElementById("board"), msg=document.getElementById("message");

function K(r,c){return r+","+c}
function isWall(r,c){return r<0||c<0||r>=rows||c>=cols||map[r].charAt(c)==="#"}
function isDoor(r,c){return r===0&&c===7}
function hasObstacle(r,c){return !!obstacles[K(r,c)]}
function boxAt(r,c){return boxTypes[K(r,c)]||null}
function free(r,c){return !isWall(r,c)&&!isDoor(r,c)&&!hasObstacle(r,c)&&!boxAt(r,c)}
function targetAt(r,c){return targetTypes[K(r,c)]||null}
function img(src,cls){var i=document.createElement("img");i.src=A+src;i.className=cls||"";return i}
function cellSize(){
 var ww=window.innerWidth||636, wh=window.innerHeight||740;
 var max=Math.floor(Math.min((ww-10)/cols,(wh-54)/rows));
 var allowed=[96,88,80,72,64,56,48],i;
 for(i=0;i<allowed.length;i++)if(allowed[i]<=max)return allowed[i];
 return Math.max(42,max);
}
function render(){
 var s=cellSize(); board.style.width=(cols*s)+"px"; board.style.height=(rows*s)+"px"; board.innerHTML="";
 for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
   var el=document.createElement("div"); el.className="cell"; el.style.width=s+"px";el.style.height=s+"px";el.style.left=(c*s)+"px";el.style.top=(r*s)+"px";
   if(isWall(r,c)){ el.appendChild(img("wall_"+(((r*5+c)%6)+1)+".png","base")); }
   else if(isDoor(r,c)){ el.appendChild(img("door_"+door+".png","base")); }
   else{
     el.appendChild(img("floor_"+floorVariant[K(r,c)]+".png","floor"));
     var tt=targetAt(r,c); if(tt)el.appendChild(img("target_"+tt+".png","base"));
     var ob=obstacles[K(r,c)]; if(ob)el.appendChild(img("obstacle_"+ob+".png","base"));
     var bt=boxAt(r,c); if(bt)el.appendChild(img("crate_"+bt+".png","actor"));
     if(player.r===r&&player.c===c)el.appendChild(img("player_"+player.dir+"_"+(walking?(phase%2?"step1":"step2"):"idle")+".png","actor"));
   }
   (function(rr,cc){el.onclick=function(){tap(rr,cc)}})(r,c);
   board.appendChild(el);
 }
 document.getElementById("moves").innerHTML="Moves "+moves;
}
function snap(){var b={};for(var k in boxTypes)b[k]=boxTypes[k];history.push({p:{r:player.r,c:player.c,dir:player.dir},b:b,m:moves,door:door});}
function restore(o){player=o.p;boxTypes=o.b;moves=o.m;door=o.door;finished=false;walking=false;render()}
function dir(dr,dc){if(dr<0)return"U";if(dr>0)return"D";if(dc<0)return"L";return"R"}
function allCorrect(){
 for(var k in targetTypes) if(boxTypes[k]!==targetTypes[k]) return false;
 return true;
}
function moveOne(dr,dc,push){
 if(finished)return false;
 var nr=player.r+dr,nc=player.c+dc; player.dir=dir(dr,dc);
 var bt=boxAt(nr,nc);
 if(bt){
   if(!push)return false;
   var br=nr+dr,bc=nc+dc;
   if(!free(br,bc))return false;
   snap(); delete boxTypes[K(nr,nc)]; boxTypes[K(br,bc)]=bt; player.r=nr;player.c=nc;moves++;phase++;render();
   if(allCorrect())winSequence();
   return true;
 }
 if(isWall(nr,nc)||isDoor(nr,nc)||hasObstacle(nr,nc))return false;
 snap();player.r=nr;player.c=nc;moves++;phase++;render();return true;
}
function bfs(sr,sc,tr,tc,allowDoor){
 var q=[[sr,sc]],h=0,seen={},prev={},dirs=[[-1,0],[1,0],[0,-1],[0,1]];seen[K(sr,sc)]=1;
 while(h<q.length){
  var p=q[h++],r=p[0],c=p[1];if(r===tr&&c===tc)break;
  for(var i=0;i<4;i++){var nr=r+dirs[i][0],nc=c+dirs[i][1],kk=K(nr,nc);
   var ok=nr>=0&&nc>=0&&nr<rows&&nc<cols&&!isWall(nr,nc)&&!hasObstacle(nr,nc)&&!boxAt(nr,nc);
   if(isDoor(nr,nc))ok=!!allowDoor;
   if(ok&&!seen[kk]){seen[kk]=1;prev[kk]=[r,c];q.push([nr,nc]);}
  }
 }
 if(!seen[K(tr,tc)])return null;
 var path=[],cr=tr,cc=tc;
 while(cr!==sr||cc!==sc){path.push([cr,cc]);var pp=prev[K(cr,cc)];if(!pp)return null;cr=pp[0];cc=pp[1]}
 path.reverse();return path;
}
function walk(path,done,allowDoor){
 if(!path||!path.length){if(done)done();return}
 walking=true;var i=0;
 function step(){
   if(i>=path.length){walking=false;render();if(done)done();return}
   var rr=path[i][0],cc=path[i][1],dr=rr-player.r,dc=cc-player.c;
   player.dir=dir(dr,dc);player.r=rr;player.c=cc;moves++;phase++;render();i++;setTimeout(step,115);
 }
 step();
}
function tap(r,c){
 if(walking||finished)return;
 var bt=boxAt(r,c);
 if(bt){var dr=r-player.r,dc=c-player.c;if(Math.abs(dr)+Math.abs(dc)===1)moveOne(dr,dc,true);return}
 if(isWall(r,c)||isDoor(r,c)||hasObstacle(r,c))return;
 var p=bfs(player.r,player.c,r,c,false); if(p)walk(p,null,false);
}
function winSequence(){
 finished=true; walking=true;
 setTimeout(function(){door="half";render();},180);
 setTimeout(function(){door="open";render();},520);
 setTimeout(function(){
   // walk to cell below door, then through the open doorway
   finished=false;
   var path=bfs(player.r,player.c,1,7,false);
   if(!path){walking=false;finished=true;showDone();return}
   walk(path,function(){
     walking=true;player.dir="U";phase++;render();
     setTimeout(function(){player.r=0;player.c=7;render();},120);
     setTimeout(function(){player.r=-1;player.c=7;walking=false;finished=true;render();showDone();},300);
   },false);
 },760);
}
function showDone(){
 msg.innerHTML="LEVEL COMPLETE<small>"+moves+" moves · Cargo correctly loaded</small>";
 msg.style.display="block";
 var b=board.getBoundingClientRect();msg.style.left=Math.round(b.left+b.width/2-msg.offsetWidth/2)+"px";msg.style.top=Math.round(b.top+b.height/2-msg.offsetHeight/2+12)+"px";
}
document.getElementById("undo").onclick=function(){if(walking||!history.length)return;restore(history.pop())};
document.getElementById("reset").onclick=function(){location.reload()};
window.onresize=render;
render();
})();
</script>
</body>
</html>
