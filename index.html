<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kindle Screen Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}
body{padding:12px}
h1{font-size:28px;margin:0 0 12px;font-weight:900}
.box{border:3px solid #000;padding:10px;margin:0 0 10px;font-size:20px;line-height:1.45}
.label{font-weight:900}
#grid{margin-top:12px;border:3px solid #000;position:relative;width:100%;height:180px;overflow:hidden}
#grid:before{
 content:"";
 position:absolute;inset:0;
 background-image:
 linear-gradient(to right,#bbb 1px,transparent 1px),
 linear-gradient(to bottom,#bbb 1px,transparent 1px);
 background-size:48px 48px;
}
#gridText{position:relative;z-index:2;display:inline-block;background:#fff;border:2px solid #000;padding:6px;font-size:17px;font-weight:bold;margin:8px}
button{width:100%;height:46px;border:3px solid #000;background:#fff;color:#000;font-size:19px;font-weight:900;border-radius:0;-webkit-appearance:none}
</style>
</head>
<body>
<h1>KINDLE SCREEN TEST</h1>

<div class="box">
 <div><span class="label">screen:</span> <span id="screenSize">-</span></div>
 <div><span class="label">available:</span> <span id="availSize">-</span></div>
 <div><span class="label">viewport:</span> <span id="viewportSize">-</span></div>
 <div><span class="label">inner:</span> <span id="innerSize">-</span></div>
 <div><span class="label">devicePixelRatio:</span> <span id="dpr">-</span></div>
 <div><span class="label">orientation:</span> <span id="orientation">-</span></div>
</div>

<div class="box">
 <div><span class="label">Page usable width:</span> <span id="usableW">-</span></div>
 <div><span class="label">Estimated Sokoban height:</span> <span id="gameH">-</span></div>
 <div><span class="label">Best discrete cell sizes:</span></div>
 <div id="cells">-</div>
</div>

<div id="grid"><span id="gridText">48 px reference grid</span></div>

<button id="refresh" type="button">REFRESH MEASUREMENTS</button>

<script>
(function(){
 function n(v){return Math.round(v||0)}
 function measure(){
  var de=document.documentElement;
  var vw=(window.visualViewport&&window.visualViewport.width)||de.clientWidth||window.innerWidth;
  var vh=(window.visualViewport&&window.visualViewport.height)||de.clientHeight||window.innerHeight;
  document.getElementById("screenSize").innerHTML=n(screen.width)+" x "+n(screen.height);
  document.getElementById("availSize").innerHTML=n(screen.availWidth)+" x "+n(screen.availHeight);
  document.getElementById("viewportSize").innerHTML=n(vw)+" x "+n(vh);
  document.getElementById("innerSize").innerHTML=n(window.innerWidth)+" x "+n(window.innerHeight);
  document.getElementById("dpr").innerHTML=window.devicePixelRatio||1;
  document.getElementById("orientation").innerHTML=(vw>=vh)?"landscape":"portrait";
  var usableW=n(vw-12);
  var gameH=n(vh-52);
  document.getElementById("usableW").innerHTML=usableW+" px";
  document.getElementById("gameH").innerHTML=gameH+" px";
  var sizes=[96,88,80,72,64,56,48],out=[],i,s,cols,rows;
  for(i=0;i<sizes.length;i++){
   s=sizes[i];
   cols=Math.floor(usableW/s);
   rows=Math.floor(gameH/s);
   out.push(s+"px: "+cols+" x "+rows+" cells");
  }
  document.getElementById("cells").innerHTML=out.join("<br>");
 }
 document.getElementById("refresh").onclick=measure;
 window.onresize=measure;
 measure();
})();
</script>
</body>
</html>
